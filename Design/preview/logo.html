<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Logo</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 24px; }
  .row { display: flex; align-items: center; gap: 32px; padding: 12px 0; border-bottom: 1px solid var(--border-soft); }
  .row:last-child { border: 0; }
  .row.dark { background: var(--ink-10); padding: 16px; border-radius: 4px; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--fg-muted); margin-left: auto; }
</style></head>
<body>
<div class="row"><img src="../assets/logo.svg" width="220" alt="Vostok AutoImport"><span class="meta">Wordmark · light</span></div>
<div class="row dark"><img src="../assets/logo.svg" width="220" alt="" style="filter: invert(1)"><span class="meta" style="color:rgba(245,243,238,0.5)">Wordmark · dark (inverted)</span></div>
<div class="row"><img src="../assets/logo-mark.svg" width="48" alt=""><img src="../assets/logo-mark.svg" width="32" alt=""><img src="../assets/logo-mark.svg" width="20" alt=""><span class="meta">Mark · 48 / 32 / 20</span></div>
</body></html>
