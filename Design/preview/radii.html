<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 24px; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .box { width: 64px; height: 64px; background: var(--ink-10); border: 1px solid var(--ink-10); }
  .name { font-family: var(--font-mono); font-size: 10px; color: var(--ink-30); font-weight: 600; }
  .px { font-family: var(--font-mono); font-size: 10px; color: var(--fg-muted); }
</style></head>
<body>
<div class="grid">
  <div class="item"><div class="box" style="border-radius:2px"></div><span class="name">--r-xs</span><span class="px">2px</span></div>
  <div class="item"><div class="box" style="border-radius:4px"></div><span class="name">--r-sm</span><span class="px">4px</span></div>
  <div class="item"><div class="box" style="border-radius:8px"></div><span class="name">--r-md</span><span class="px">8px</span></div>
  <div class="item"><div class="box" style="border-radius:12px"></div><span class="name">--r-lg</span><span class="px">12px</span></div>
  <div class="item"><div class="box" style="border-radius:16px"></div><span class="name">--r-xl</span><span class="px">16px</span></div>
  <div class="item"><div class="box" style="border-radius:999px"></div><span class="name">--r-pill</span><span class="px">∞</span></div>
</div>
</body></html>
