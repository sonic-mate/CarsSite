<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Type — Display</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 24px; }
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--border-soft); }
  .row:last-child { border: 0; }
  .specimen { color: var(--ink-10); }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--fg-muted); white-space: nowrap; }
</style></head>
<body>
<div class="row"><span class="specimen display-l" style="font-size:56px">АВТО ИЗ ЯПОНИИ</span><span class="meta">Unbounded 600 · 64</span></div>
<div class="row"><span class="specimen display-m" style="font-size:40px">ПОД КЛЮЧ ЗА 45 ДНЕЙ</span><span class="meta">Unbounded 600 · 48</span></div>
<div class="row"><span class="specimen display-m" style="font-size:28px">КАТАЛОГ АВТОМОБИЛЕЙ</span><span class="meta">Unbounded 600 · 32</span></div>
</body></html>
