<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Stats</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 24px; background: var(--ink-10); color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
  .stat { border-left: 1px solid rgba(200,164,92,0.4); padding: 4px 0 4px 14px; }
  .num { font-family: var(--font-display); font-size: 44px; line-height: 1; letter-spacing: 0.01em; color: #fff; }
  .num .gold { color: var(--gold); }
  .lbl { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(245,243,238,0.6); margin-top: 6px; }
</style></head>
<body>
<div class="grid">
  <div class="stat"><div class="num">1 247</div><div class="lbl">Авто доставлено</div></div>
  <div class="stat"><div class="num">8 <span class="gold">лет</span></div><div class="lbl">На рынке</div></div>
  <div class="stat"><div class="num">3</div><div class="lbl">Страны импорта</div></div>
  <div class="stat"><div class="num">45 <span class="gold">дн.</span></div><div class="lbl">Средний срок</div></div>
</div>
</body></html>
