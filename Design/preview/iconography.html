<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Iconography</title>
<link rel="stylesheet" href="../colors_and_type.css">

  .item svg { color: var(--ink-30); }
  .name { font-family: var(--font-mono); font-size: 9px; color: var(--fg-muted); }
  .note { margin-top: 14px; font-size: 11px; color: var(--fg-muted); }
</style></head>
