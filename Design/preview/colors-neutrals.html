<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Colors — Neutrals</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .swatch { border: 1px solid var(--border); border-radius: var(--r-sm); overflow: hidden; }
  .chip { height: 60px; }
  .meta { padding: 8px 10px; background: #fff; }
  .name { font-size: 11px; font-weight: 600; color: var(--ink-30); }
  .hex { font-family: var(--font-mono); font-size: 10px; color: var(--fg-muted); margin-top: 2px; }
</style></head>
<body>
<div class="grid">
  <div class="swatch"><div class="chip" style="background:#F5F3EE"></div><div class="meta"><div class="name">ink-100</div><div class="hex">#F5F3EE</div></div></div>
  <div class="swatch"><div class="chip" style="background:#EDEAE2"></div><div class="meta"><div class="name">ink-95</div><div class="hex">#EDEAE2</div></div></div>
  <div class="swatch"><div class="chip" style="background:#D4CFC2"></div><div class="meta"><div class="name">ink-85</div><div class="hex">#D4CFC2</div></div></div>
  <div class="swatch"><div class="chip" style="background:#8A8478"></div><div class="meta"><div class="name">ink-60</div><div class="hex">#8A8478</div></div></div>
  <div class="swatch"><div class="chip" style="background:#3A3833"></div><div class="meta"><div class="name">ink-30</div><div class="hex">#3A3833</div></div></div>
  <div class="swatch"><div class="chip" style="background:#0F1115"></div><div class="meta"><div class="name">ink-10</div><div class="hex">#0F1115</div></div></div>
</div>
</body></html>
