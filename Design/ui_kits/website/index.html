<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Восток АвтоИмпорт — UI Kit</title>
<link rel="stylesheet" href="styles.css?v=4"/>
<style>
  .hero h1, .hero h2, .hero h3, .hero h4, .hero h5,
  .section-dark h1, .section-dark h2, .section-dark h3, .section-dark h4, .section-dark h5,
  .surface-dark h1, .surface-dark h2, .surface-dark h3, .surface-dark h4, .surface-dark h5 {
    color: #F5F3EE !important;
  }
  .hero h1 { font-size: 76px !important; max-width: 14ch !important; line-height: 0.98 !important; }
  .hero p.lead { margin-top: 8px; }
  .hero-car-stage { right: -120px !important; bottom: 40px !important; opacity: 0.55 !important; width: 620px !important; }
  .site-header nav { gap: 20px !important; }
  .site-header nav a { white-space: nowrap; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="data.js"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="Header.jsx"></script>
<script type="text/babel" src="Home.jsx"></script>
<script type="text/babel" src="Catalog.jsx"></script>
<script type="text/babel" src="CarDetail.jsx"></script>
<script type="text/babel" src="Calculator.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const App = () => {
  const [screen, setScreen] = React.useState("home");
  const [activeCar, setActiveCar] = React.useState(null);

  const onNav = (s) => { setScreen(s); window.scrollTo(0, 0); };
  const onOpenCar = (c) => { setActiveCar(c); setScreen("detail"); window.scrollTo(0, 0); };
  const onBack = () => { setScreen("catalog"); window.scrollTo(0, 0); };

  return (
    <>
      <Header onNav={onNav} current={screen}/>
      {screen === "home" && <Home onNav={onNav} onOpenCar={onOpenCar}/>}
      {screen === "catalog" && <Catalog onOpenCar={onOpenCar}/>}
      {screen === "detail" && <CarDetail car={activeCar} onBack={onBack}/>}
      {screen === "calculator" && <Calculator/>}
      {screen === "process" && <Process/>}
      <Footer/>
    </>
  );
};

const wait = setInterval(() => {
  if (window.Home && window.Catalog && window.CarDetail && window.Calculator && window.Header) {
    clearInterval(wait);
    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  }
}, 50);
</script>
</body>
</html>
